                    'Хлеб', 'Молоко', 'Яйца', 'Масло сливочное', 'Овощи (огурцы, помидоры, морковь)', 'Фрукты (бананы, груши)',
                    'Курица/мясо для семейных обедов/ужинов', 'Крупы (гречка, рис)'
                ]},
                { section: 'Для кошки/Бытовое', tasks: [
                    'Корм для кошки', 'Туалетная бумага', 'Бумажные полотенца', 'Средства для уборки'
                ]}
            ]]
        ];

        // 2. Функция для создания начальных задач в Firestore
        async function setupInitialTasks() {
            if (initialTasksLoaded) return;
            initialTasksLoaded = true;

            updateLoaderText('Проверка существующих задач...');

            // Используем query для проверки наличия документов
            const q = query(tasksRef(userId), orderBy('order', 'asc')); // Используем orderBy для правильного порядка в onSnapshot
            const tasksSnapshot = await getDocs(q);

            if (tasksSnapshot.empty) {
                console.log("No tasks found. Setting up initial plan.");
                updateLoaderText('Создание нового плана (пакетная запись)...');
                
                const batch = writeBatch(db);
                let taskIndex = 0;

                taskPlan.forEach(([day, sections]) => {
                    sections.forEach(({ section, tasks }) => {
                        tasks.forEach(taskText => {
                            // Генерация более уникального ID, чтобы избежать дубликатов при изменении плана
                            const baseId = day.replace(/[^a-zA-Zа-яА-Я0-9]/g, '');
                            const textHash = taskText.substring(0, 10).replace(/[^a-zA-Zа-яА-Я0-9]/g, '');
                            const taskId = `${baseId}_${textHash}_${taskIndex++}`;
                            
                            const taskDocRef = doc(tasksRef(userId), taskId);
                            const taskData = {
                                day: day,
                                section: section,
                                text: taskText,
                                completed: false,
                                timeSpent: '', // String for minutes/hours
                                comment: '',
                                order: taskIndex,
                                createdAt: new Date().toISOString()
                            };
                            batch.set(taskDocRef, taskData);
                        });
                    });
                });

                try {
                    await batch.commit();
                    console.log("Initial plan committed to Firestore.");
                } catch (error) {
                    console.error("Error writing batch: ", error);
                }
            } else {
                console.log("Tasks already exist in Firestore.");
            }
        }

        // 3. Функция для обновления одной задачи
        async function updateTask(taskId, field, value) {
            if (!userId) {
                console.warn("User ID not available yet. Cannot save data.");
                return;
            }

            const taskDocRef = doc(tasksRef(userId), taskId);
            const dataToUpdate = {};
            dataToUpdate[field] = value;

            try {
                // Принудительно вызываем resize для textarea, если обновляем комментарий программно
                if (field === 'comment') {
                    requestAnimationFrame(() => {
                        const textarea = document.getElementById(`comment-${taskId}`);
                        if (textarea) {
                            autoResizeTextarea({ target: textarea });
                        }
                    });
                }
                await updateDoc(taskDocRef, dataToUpdate);
                console.log(`Task ${taskId} updated: ${field} = ${value}`);
            } catch (error) {
                console.error("Error updating task: ", error);
            }
        }

        // 4. Реализация onSnapshot для обновления UI в реальном времени
        function setupRealtimeListener() {
            if (!userId) {
                console.error("Cannot set up listener: userId is null.");
                return;
            }
            
            updateLoaderText('Загрузка данных плана...');

            const q = query(tasksRef(userId), orderBy('order', 'asc'));

            const unsubscribe = onSnapshot(q, (snapshot) => {
                const tasks = [];
                snapshot.forEach(doc => {
                    tasks.push({ id: doc.id, ...doc.data() });
                });
                renderTasks(tasks);
                
                // Скрываем загрузчик после первой успешной загрузки,
                // только если элемент существует в DOM.
                const loadingSpinner = document.getElementById('loading-spinner');
                if (loadingSpinner) {
                    loadingSpinner.style.display = 'none';
                }
                
            }, (error) => {
                console.error("Error getting tasks snapshot: ", error);
                updateLoaderText('Ошибка загрузки данных.');
            });
            // Не отписываемся, так как нам нужно постоянное обновление данных
        }

        // 5. Функция для рендеринга задач
        function renderTasks(tasks) {
            const container = document.getElementById('task-container');
            if (!container) return;

            // Группировка задач по дню
            const groupedTasks = tasks.reduce((acc, task) => {
                if (!acc[task.day]) {
                    acc[task.day] = {};
                }
                if (!acc[task.day][task.section]) {
                    acc[task.day][task.section] = [];
                }
                acc[task.day][task.section].push(task);
                return acc;
            }, {});

            let html = '';

            for (const day in groupedTasks) {
                html += `
                    <div class="mb-8 p-4 bg-white rounded-xl shadow-lg">
                        <h2 class="text-2xl font-extrabold text-indigo-700 mb-4 border-b-2 border-indigo-100 pb-2">${day}</h2>
                `;
                const sections = groupedTasks[day];
                for (const section in sections) {
                    html += `
                        <h3 class="text-lg font-semibold text-gray-700 mt-6 mb-3 px-2 py-1 bg-gray-50 rounded-lg">${section}</h3>
                        <div class="space-y-3">
                    `;
                    sections[section].forEach(task => {
                        html += generateTaskCard(task);
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            }
            
            // Если tasks не пуст, мы заменяем контейнер задач с загрузчиком на сгенерированный HTML
            // Если tasks пуст, мы оставляем загрузчик (он будет виден, пока идет инициализация/запись в базу)
            if (tasks.length > 0) {
                 container.innerHTML = html;
            }
            
            attachEventListeners();
        }

        // 6. Генерация HTML для одной карточки задачи
        function generateTaskCard(task) {
            const isCompleted = task.completed;
            const cardClass = isCompleted ? 'completed shadow-lg' : 'shadow-md hover:shadow-lg';
            const checkboxChecked = isCompleted ? 'checked' : '';

            return `
                <div id="task-${task.id}" class="task-card flex flex-col p-4 rounded-xl border border-gray-200 ${cardClass}">
                    <!-- Заголовок и чекбокс -->
                    <div class="flex items-start mb-2">
                        <input type="checkbox" id="check-${task.id}" data-task-id="${task.id}" data-field="completed" ${checkboxChecked}
                               class="task-input checkbox-large h-6 w-6 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500 mr-3 mt-1"
                               style="min-width: 1.5rem;">
                        <label for="check-${task.id}" class="task-text text-base font-medium text-gray-900 flex-1 break-words">
                            ${task.text}
                        </label>
                    </div>

                    <!-- Детали (Время и Комментарий) -->
                    <div class="flex flex-col sm:flex-row sm:space-x-4 mt-2 pt-2 border-t border-gray-100">
                        <!-- Время -->
                        <div class="w-full sm:w-1/3 mb-3 sm:mb-0">
                            <label for="time-${task.id}" class="block text-xs font-medium text-gray-500 mb-1">
                                Затрачено времени (мин/ч)
                            </label>
                            <input type="text" id="time-${task.id}" data-task-id="${task.id}" data-field="timeSpent" value="${task.timeSpent || ''}" placeholder="30 мин / 1 ч"
                                   class="task-input time-input w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                        </div>

                        <!-- Комментарий -->
                        <div class="w-full sm:flex-1">
                            <label for="comment-${task.id}" class="block text-xs font-medium text-gray-500 mb-1">
                                Комментарий
                            </label>
                            <textarea id="comment-${task.id}" data-task-id="${task.id}" data-field="comment" rows="2" placeholder="Ваши заметки..."
                                      class="task-input comment-input w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500 resize-none">${task.comment || ''}</textarea>
                        </div>
                    </div>
                </div>
            `;
        }

        // 7. Назначение обработчиков событий
        function attachEventListeners() {
            document.querySelectorAll('.task-input').forEach(input => {
                const taskId = input.dataset.taskId;
                const field = input.dataset.field;

                if (input.type === 'checkbox') {
                    input.onchange = (e) => {
                        updateTask(taskId, field, e.target.checked);
                    };
                } else if (input.tagName === 'TEXTAREA' || input.type === 'text') {
                    // Используем onblur для сохранения текста и времени, чтобы не спамить базу данных при каждом нажатии клавиши
                    input.onblur = (e) => {
                        updateTask(taskId, field, e.target.value.trim());
                    };
                    // Дополнительно: автоматическое изменение высоты textarea
                    if (input.tagName === 'TEXTAREA') {
                        input.addEventListener('input', autoResizeTextarea);
                        autoResizeTextarea({ target: input }); // Первоначальная настройка высоты
                    }
                }
            });
        }

        function autoResizeTextarea(e) {
            const textarea = e.target;
            textarea.style.height = 'auto'; // Сброс высоты
            // Используем scrollHeight для установки новой высоты
            const newHeight = textarea.scrollHeight;
            textarea.style.height = (newHeight) + 'px'; // Установка новой высоты
        }

        // Запуск приложения
        window.onload = initFirebase;
    </script>
</head>
<body>
    <div class="min-h-screen p-4 sm:p-6 max-w-4xl mx-auto">
        <header class="mb-8">
            <div class="flex justify-between items-center bg-indigo-600 p-4 rounded-xl shadow-xl">
                <h1 class="text-3xl font-bold text-white">План 2-х Недель</h1>
                <div class="text-sm font-medium text-indigo-200">
                    <p>Состояние</p>
                    <p id="user-id-display" class="text-white text-xs mt-1 break-all">ID: Загрузка...</p>
                </div>
            </div>
        </header>

        <main id="task-container" class="space-y-6">
            <!-- Задачи будут загружены сюда -->
            <div id="loading-spinner" class="text-center p-12 text-gray-500">
                <svg class="mx-auto h-12 w-12 text-gray-400 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="mt-4" id="loader-text">Инициализация базы данных (Firestore)...</p>
                <p class="text-xs text-gray-400 mt-1">Подключение к облаку.</p>
            </div>
        </main>

        <footer class="mt-12 text-center text-xs text-gray-400 p-4 border-t border-gray-200">
            <p>Ваши данные сохраняются в облаке (Firestore) в реальном времени.</p>
        </footer>
    </div>
</body>
</html>
